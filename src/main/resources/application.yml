spring:
  application:
    name: playlist-api
  datasource:
    url: jdbc:h2:mem:playlistdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:PLEASE_OVERRIDE_IN_PRODUCTION_WITH_A_SECRET_KEY_OF_AT_LEAST_256_BITS_OR_32_BYTES}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:PlaylistAPI}

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:test-client-id}
  client-secret: ${SPOTIFY_CLIENT_SECRET:test-client-secret}
  token-url: ${SPOTIFY_TOKEN_URL:https://accounts.spotify.com/api/token}
  api-url: ${SPOTIFY_API_URL:https://api.spotify.com/v1}

gemini:
  api-key: ${GEMINI_API_KEY:PLACEHOLDER_CONFIGURE_GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
  max-retries: ${GEMINI_MAX_RETRIES:2}
